# The TestSprite hackathon. TestSprite's pull-request trigger waits for a deployment that names
# a URL, and this repository has no preview deployment of its own: the app is served from one
# Cloudflare deployment. So, on the TestSprite branches only, this marks the live site as the
# pull request's preview, which is the site the suite reads anyway. Nothing is built or deployed;
# the only write is a deployment record on this repository. It does not exist on main.

name: testsprite-preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    if: startsWith(github.head_ref, 'testsprite/')
    runs-on: ubuntu-latest
    steps:
      - name: mark the live site as this pull request's preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$(printf '{"ref":"%s","environment":"testsprite-preview","auto_merge":false,"required_contexts":[],"transient_environment":true,"description":"the live site, which the TestSprite suite reads"}' "$SHA" \
            | gh api -X POST "repos/$REPO/deployments" --input - --jq .id)
          gh api -X POST "repos/$REPO/deployments/$id/statuses" \
            -f state=success -f environment_url=https://pools.usenami.io -f log_url=https://pools.usenami.io >/dev/null
          echo "deployment $id -> https://pools.usenami.io"
