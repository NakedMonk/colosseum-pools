name: ci

# `scrub` is the hygiene gate: generic patterns for credentials, infrastructure identity and
# internal paths. It runs on every branch, because this repository is meant to go public and
# anything that reaches its history stays there after a revert. The gate is run next to its
# own falsification test, so a pattern that silently stops matching turns this job red.
#
# `contracts` builds and runs the Foundry tests. They use the hyper-evm-lib simulator in
# offline mode, so no RPC is involved and a run is deterministic.
#
# Actions are pinned by commit SHA, not by tag. A tag is a moving pointer. Checkouts don't
# keep the token: no job pushes, and the jobs run code from the branch under test.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: gate can still go red
        run: ./scripts/test-scrub-check.sh
      - name: hygiene gate
        run: ./scripts/scrub-check.sh
      - name: review bot reads the code and skips the rest (.gemini/config.yaml)
        run: bash scripts/test-gemini-config.sh

  identity:
    # Every commit must carry a GitHub noreply identity. Needs the whole history. On a pull
    # request it checks the branch head, not the temporary merge commit GitHub builds for
    # the run, which never lands anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: check can still go red
        run: ./scripts/test-identity-check.sh
      - name: commit identities
        run: ./scripts/identity-check.sh HEAD

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install -r spike/requirements.txt -r agents/requirements.txt
      - name: test
        run: python -m unittest discover -s gateway/tests -t . -v
      - name: agent client
        run: python -m unittest discover -s agents/tests -t . -v
      - name: keeper
        run: python -m unittest discover -s ops/tests -t . -v
      - name: the mutation check can still go red
        run: ./scripts/test-mutations-check.sh
      - name: every mutation still points at the code it guards
        run: python scripts/mutations.py --check
      - name: every audit finding still points at a test that exists
        run: python scripts/findings-check.py

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      # Test files are named one by one: Node 22 reads a bare directory as a module path.
      - name: pure helpers (CBOR, navigation, number formats)
        run: node --version && node --test app/tests/*.test.mjs
      - name: the site packer copies files only, of a commit that has a site
        run: bash scripts/test-pack-site.sh

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - name: build
        run: forge build
      - name: check can still go red
        run: ./scripts/test-abi-check.sh
      - name: structs match their copies in the app and the agents
        run: ./scripts/abi-check.py
      - name: test
        run: forge test -vv
