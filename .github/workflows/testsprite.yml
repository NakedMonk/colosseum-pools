# The TestSprite hackathon. TestSprite's pull-request trigger waits for a deployment that names a
# preview URL, and this repository has none: the app is served from one Cloudflare deployment, and
# a deployment record that named the live site was not taken ("the URL never became ready to test").
# So, on the TestSprite branches only, the suite is run from here with the TestSprite CLI against
# the live site, which is what the suite reads anyway. Nothing is built or deployed, and the job
# does not check the repository out. Every test only reads pages. It does not exist on main.
#
# TESTSPRITE_API_KEY is a repository secret. The CLI resolves it from the environment before any
# credentials file, so there is no `testsprite setup` step. The CLI version is pinned.
#
# Run 1 (19.10, `test run --all`) dispatched all eight tests at once and result.json carried only
# statuses. So this job now (1) reads WHY each test last failed before running anything — the
# CLI's own failure analysis and failure bundle, no portal needed — and (2) runs the tests one at
# a time, each to its verdict, instead of all at once. `--max-concurrency` does not apply to
# `--all` against a public URL (CLI docs: tunnel batches only), so "one at a time" is a loop.
# The ids are the project's eight tests as run 1 listed them (summary.json, run 39235348330).

name: testsprite

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  suite:
    if: startsWith(github.head_ref, 'testsprite/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
      PROJECT_ID: e22437c5-ce0a-474d-946a-86274de95076
      TARGET_URL: https://pools.usenami.io
      # id|title, in run 1's order
      TESTS: |
        d44ba1c5-5a7e-46d2-9a01-9576ea589b4f|Load the evidence page from header navigation
        d4fffe6a-ef07-4c5b-a0db-aaf76ba2a3dd|Open Economics page from header navigation
        9508c5ab-54b1-4c70-a8bd-7993e7877a72|Open Terms page from header navigation
        fcf4b949-b6c1-45df-a843-55a87206ae72|Open a non-existent route
        9f589192-36a0-40b2-b6f7-b84214d2dd1f|Accept demo gate and load pools home
        b1dd7dd9-e91b-44f1-a2a2-60c2de7eed35|Use the economics calculator
        3d5a213e-9b9a-4ec0-a0f1-9f29a29a225d|Verify header navigation remains available after entry
        d799e840-2bb6-4682-8a92-9eeb7652c608|Open a pool verification page
    steps:
      - name: install the TestSprite CLI (pinned)
        run: npm install -g @testsprite/testsprite-cli@0.15.0

      - name: preflight (reported, not a gate)
        continue-on-error: true
        run: testsprite doctor

      - name: why each test last failed (before anything new runs)
        continue-on-error: true
        run: |
          mkdir -p diag/previous
          printf '%s\n' "$TESTS" | while IFS='|' read -r id title; do
            [ -n "$id" ] || continue
            echo "::group::$title ($id) — latest result with analysis"
            testsprite test result "$id" --include-analysis --output json > "diag/previous/$id.result.json" 2>&1 || true
            head -c 8000 "diag/previous/$id.result.json"; echo
            run_id="$(jq -r '.runId // .result.runId // empty' "diag/previous/$id.result.json" 2>/dev/null)"
            status="$(jq -r '.status // .result.status // empty' "diag/previous/$id.result.json" 2>/dev/null)"
            if [ -n "$run_id" ] && [ "$status" != "passed" ]; then
              testsprite test artifact get "$run_id" --failed-only --out "diag/previous/$id" > /dev/null 2>&1 || true
              find "diag/previous/$id" -maxdepth 2 -name '*.json' 2>/dev/null | while read -r f; do
                echo "--- $f"; head -c 4000 "$f"; echo
              done
            fi
            echo "::endgroup::"
          done

      - name: run the tests one at a time against the live site
        run: |
          mkdir -p runs diag/now
          printf '%s\n' "$TESTS" | while IFS='|' read -r id title; do
            [ -n "$id" ] || continue
            echo "::group::$title ($id)"
            rc=0
            testsprite test run "$id" --target-url "$TARGET_URL" --wait --timeout 900 \
              --output json > "runs/$id.json" || rc=$?
            status="$(jq -r '.status // empty' "runs/$id.json" 2>/dev/null)"
            run_id="$(jq -r '.runId // empty' "runs/$id.json" 2>/dev/null)"
            echo "exit=$rc status=${status:-?} run=${run_id:-?}"
            head -c 4000 "runs/$id.json"; echo
            if [ "$rc" != 0 ] && [ -n "$run_id" ]; then
              testsprite test artifact get "$run_id" --failed-only --out "diag/now/$id" > /dev/null 2>&1 || true
              find "diag/now/$id" -maxdepth 2 -name '*.json' 2>/dev/null | while read -r f; do
                echo "--- $f"; head -c 4000 "$f"; echo
              done
            fi
            echo "::endgroup::"
            printf '%s|%s|%s|%s\n' "$title" "${status:-?}" "$rc" "${run_id:-?}" >> runs/table.txt
          done
          echo "## one at a time"
          column -t -s '|' runs/table.txt || cat runs/table.txt
          if awk -F'|' '$3 != 0 {bad=1} END {exit bad ? 0 : 1}' runs/table.txt; then
            echo "::error::not every test passed — see the table above and the diag artifact"
            exit 1
          fi

      - name: keep the failure bundles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: testsprite-diag-${{ github.run_id }}
          path: |
            diag/
            runs/
          retention-days: 14
          if-no-files-found: warn
